syntax = "proto3";

package report.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/soundmap/soundmap/gen/go/report/v1;reportv1";

message TimeRange {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
}

message ZoneStats {
  string h3_index = 1;
  double avg_decibel = 2;
  double max_decibel = 3;
  double min_decibel = 4;
  double p95_decibel = 5;
  int64 reading_count = 6;
  int32 alert_count = 7;
  common.v1.NoiseCategory dominant_category = 8;
  string worst_hour = 9;
}

message GenerateZoneReportRequest {
  string h3_index = 1;
  TimeRange time_range = 2;
  int32 resolution = 3;
}

message GenerateZoneReportResponse {
  string report_id = 1;
  ZoneStats zone_stats = 2;
  google.protobuf.Timestamp generated_at = 3;
  repeated string recommendations = 4;
}

message GenerateCityReportRequest {
  string city_name = 1;
  TimeRange time_range = 2;
  int32 resolution = 3;
  int32 top_n_hotspots = 4;
}

message GenerateCityReportChunk {
  int32 chunk_index = 1;
  int32 total_chunks = 2;
  repeated ZoneStats zone_stats = 3;
  string report_id = 4;
  bool is_last_chunk = 5;
}

service ReportService {
  rpc GenerateZoneReport(GenerateZoneReportRequest) returns (GenerateZoneReportResponse);
  rpc GenerateCityReport(GenerateCityReportRequest) returns (stream GenerateCityReportChunk);
}

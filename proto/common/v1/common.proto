syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/soundmap/soundmap/gen/go/common/v1;commonv1";

enum SensorType {
  SENSOR_TYPE_UNSPECIFIED = 0;
  SENSOR_TYPE_FIXED = 1;
  SENSOR_TYPE_MOBILE = 2;
  SENSOR_TYPE_VIRTUAL = 3;
}

message SensorReading {
  string sensor_id = 1;
  double latitude = 2;
  double longitude = 3;
  double decibel_level = 4;
  double frequency_hz = 5;
  google.protobuf.Timestamp timestamp = 6;
  SensorType sensor_type = 7;
}

message GeoLocation {
  double latitude = 1;
  double longitude = 2;
  string h3_index = 3;
  int32 h3_resolution = 4;
}

enum NoiseCategory {
  NOISE_CATEGORY_UNSPECIFIED = 0;
  NOISE_CATEGORY_NATURE = 1;
  NOISE_CATEGORY_TRAFFIC = 2;
  NOISE_CATEGORY_CONSTRUCTION = 3;
  NOISE_CATEGORY_INDUSTRIAL = 4;
  NOISE_CATEGORY_CROWD = 5;
}

enum HealthRiskLevel {
  HEALTH_RISK_UNSPECIFIED = 0;
  HEALTH_RISK_SAFE = 1;
  HEALTH_RISK_MODERATE = 2;
  HEALTH_RISK_HIGH = 3;
  HEALTH_RISK_CRITICAL = 4;
}

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
}

syntax = "proto3";

package ingestor.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/soundmap/soundmap/gen/go/ingestor/v1;ingestorv1";

service IngestorService {
  rpc IngestReadings(stream IngestReadingsRequest) returns (IngestReadingsResponse);
  rpc IngestSingleReading(IngestSingleReadingRequest) returns (IngestSingleReadingResponse);
  rpc GetSensorStatus(GetSensorStatusRequest) returns (GetSensorStatusResponse);
}

message IngestReadingsRequest {
  common.v1.SensorReading sensor_reading = 1;
}

message IngestReadingsResponse {
  int64 accepted_count = 1;
  int64 rejected_count = 2;
  string session_id = 3;
  google.protobuf.Timestamp ingested_at = 4;
}

message IngestSingleReadingRequest {
  common.v1.SensorReading sensor_reading = 1;
}

message IngestSingleReadingResponse {
  string reading_id = 1;
  bool accepted = 2;
  string rejection_reason = 3;
}

message GetSensorStatusRequest {
  string sensor_id = 1;
}

message GetSensorStatusResponse {
  string sensor_id = 1;
  bool is_active = 2;
  google.protobuf.Timestamp last_seen_at = 3;
  int64 total_readings_today = 4;
  double last_decibel_level = 5;
}
